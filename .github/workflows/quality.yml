name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Pin updates are reviewed manually against each action's release notes before replacement.
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run quality suite
        run: npm run check
      - name: Build production site
        run: npm run build
      - name: Audit built output accessibility
        run: npm run test:a11y
      - name: Validate built output SEO and discovery
        run: npm run test:seo
      - name: Check built output performance budgets
        run: npm run test:perf
      - name: Scan built output for secrets and internal references
        run: npm run test:hygiene
